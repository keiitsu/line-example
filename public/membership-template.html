 switch(a){

 case 'ai':message('你好，我是日日選物小幫手 🌿\n可以直接輸入問題，例如「帶狗狗可以進店嗎？」或「點數什麼時候到期？」。\n本次使用核准的示範問答，沒有呼叫真實 AI。');quick([['營業到幾點？','faq-hours'],['毛孩可以入店嗎？','faq-pet'],['退換貨說明','faq-return']]);$('#message-input').focus();break;
 case 'human':human();break;

 case 'staff':staff();break;
 case 'staff-sale':
 if(mode==='advanced'&&!state.bound){notify('請先在顧客對話中完成會員綁定。');break}
 if(state.sale){notify('同一收據已處理，不會重複發點。');break}
 state.sale=true;if(mode==='advanced'){state.points+=30;state.ledger.unshift({name:'門市消費',date:'今天 · DEMO-20260919-001',points:30})}else state.stamps+=1;
 notify(mode==='advanced'?'消費入帳成功：+30 點。請從顧客選單查詢。':'店員已發 1 章，請重新查看集點卡。');break;
 case 'staff-refund':
 if(!state.sale){notify('尚未有可退款的示範消費。');break}if(state.refunded){notify('同一筆退款已處理，不會重複扣回。');break}

 if(!$('#pos-confirm')?.checked){notify('請先確認滿額條件及 POS 折抵。');break}
 state.used=true;state.code=null;state.codeUntil=0;notify('核銷完成。顧客再次查看券夾會顯示已使用。');break;

 case 'staff-send':{

 case 'staff-close':
 if(!state.human){notify('目前沒有處理中的案件。');break}state.human=false;state.agentJoined=false;updateHeader();close();systemNote('店員已結束此次服務，恢復自動回覆');quick(mode==='advanced'?[['我的會員卡','member'],['常見問題','faq']]:[['門市集點卡','stamps'],['常見問題','faq']]);break;
 case 'toggle-menu':menuOpen=!menuOpen;$('#rich-menu').hidden=!menuOpen;$('#menu-toggle').setAttribute('aria-expanded',String(menuOpen));scrollEnd();break;
 case 'close':close();break;

 case 'profile':open('日日選物','<div class="demo-member"><span class="brand-avatar">日</span><div><strong>日日選物 · 日常店</strong><small>生活選物 / 每一天的小美好</small></div></div><p>把喜歡的生活物件，放進每一天。<br>每日 11:00–20:00<br>日常路 18 號 1 樓（示範資訊）</p>'+btn('查看門市資訊','profile-store','solid')+btn('聯絡店員','profile-human','ghost')+btn('下載此成品 HTML','download','ghost'));break;
 case 'profile-store':close();perform('store');break;case 'profile-human':close();perform('human');break;
 case 'contact':open('聯絡門市','<p>門市服務時間為每日 11:00–20:00。此為展示帳號，沒有提供真實電話撥號。</p>'+btn('在聊天中聯絡店員','profile-human','solid'));break;
 case 'extras':open('聊天功能','<div class="staff-grid">'+btn('我的會員卡','extra-member','ghost')+btn('貼圖','stickers','ghost')+btn('門市資訊','profile-store','ghost')+btn('聯絡店員','profile-human','ghost')+'</div>');break;
 case 'extra-member':close();perform('member');break;
 case 'stickers':open('選擇貼圖','<div class="stickers">'+['🌿','😊','💚','🙌','☕','🎉','👍','🙏'].map((s,i)=>btn(s,'sticker-'+i)).join('')+'</div>');break;
 case 'reset':open('重新開始體驗','<p>將清除本次會員綁定、消費、優惠券和客服紀錄，回到目前版本的初始狀態。</p>'+btn('重新開始','confirm-reset','solid')+btn('繼續體驗','close','ghost'));break;
 case 'confirm-reset':reset();notify('已重設本次體驗。');break;
 case 'help':open('互動成品說明','<p>直接使用聊天輸入、快速回覆與底部六格選單操作。此頁依 LINE 常見對話介面製作，並非 LINE 官方客戶端。</p><p><b>基礎版</b>：固定 FAQ、門市資訊、優惠券及店員集點。<br><b>進階版</b>：會員綁定、個人點數／消費、會員券、AI 問答與真人接管。</p><p>頁面上方的「門市模擬」用來試走發點、退款、核銷與店員回覆。版本切換會重置體驗。</p><p>所有資料皆為示範；沒有真實 LINE、AI、POS 或付款串接。資料只存在此分頁，重新整理即清除。</p>'+btn('開始體驗','close','solid'));break;
 case 'download':{
 const blob=new Blob([originalHtml],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='日日選物_LINE互動成品.html';link.click();setTimeout(()=>URL.revokeObjectURL(url),1500);notify('已建立獨立 HTML 下載檔。');break}
 default:if(a.startsWith('sticker-')){const s=['🌿','😊','💚','🙌','☕','🎉','👍','🙏'][Number(a.slice(8))];if(!s)return;close();message(s,'user');if(state.human)notify('貼圖已加入示範客服案件。');else {message('收到你的心意了 🌿 如果需要協助，可以直接輸入文字，或點選下方服務選單。')}}break;
 }
}
document.addEventListener('click',e=>{
 const version=e.target.closest('[data-mode]');if(version){if(version.dataset.mode!==mode){reset(version.dataset.mode);notify('已切換版本並重置體驗。')}return}
 const button=e.target.closest('[data-action]');if(button&&!button.disabled)perform(button.dataset.action);
});
$('#composer').addEventListener('submit',e=>{e.preventDefault();sendText($('#message-input').value)});

paintIcons();reset();
