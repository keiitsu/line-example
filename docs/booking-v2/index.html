*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft JhengHei',sans-serif;color:#25312e;background:#e7ebe9}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #008c56;outline-offset:2px}button{border:0}button:disabled{opacity:.4;cursor:default}.banner{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#173b30;color:white;font-size:12px}.banner button{background:none;color:white;text-decoration:underline}.app{display:grid;grid-template-columns:70px 280px minmax(320px,1fr);max-width:1440px;margin:24px auto;height:calc(100dvh - 92px);min-height:550px;background:white;border-radius:14px;overflow:hidden;box-shadow:0 18px 70px #12332316}.rail{background:#273a35;display:flex;align-items:center;flex-direction:column;gap:20px;padding:25px 8px;color:#b4cbc1}.rail b{background:#06c755;border-radius:15px;color:white;padding:12px}.rail span{font-size:24px}.rail small{margin-top:auto;writing-mode:vertical-rl;letter-spacing:3px}.list{border-right:1px solid #e3e8e5;background:#fff}.list h1{font-size:23px;padding:12px 22px 0}.search{margin:18px 18px 22px;padding:10px;background:#f3f5f4;border-radius:7px;color:#5e7068;font-size:12px}.chatitem{width:100%;display:flex;gap:12px;text-align:left;padding:20px 16px;background:#f2f7f3}.avatar{display:grid;place-items:center;width:48px;height:48px;flex-shrink:0;border-radius:18px;background:#50745d;color:white;font-size:23px;font-family:serif}.chatitem strong{display:block;margin:2px 0 6px}.chatitem small{color:#718078;font-size:11px}.listnote{padding:25px 20px;color:#69786f;font-size:12px;line-height:1.9}.listnote label{display:block;margin:16px 0 6px}.listnote select{width:100%;padding:8px;border:1px solid #dbe5df;border-radius:6px;background:white}.window{min-height:0;display:flex;flex-direction:column}.head{height:74px;flex-shrink:0;border-bottom:1px solid #d9e3de;display:flex;align-items:center;gap:12px;padding:12px 24px}.head .avatar{width:40px;height:40px;font-size:20px}.head h2{font-size:16px;margin:0 0 5px}.head small{color:#67796e}.head .tools{margin-left:auto;display:flex;gap:10px}.icon{background:transparent;font-size:21px;color:#34483b;padding:7px}.back{display:none}.chat{background:#a9c3d7;flex:1;min-height:170px;overflow:auto;padding:24px 32px;display:flex;flex-direction:column;gap:14px}.date{font-size:11px;color:white;align-self:center;background:#6f8fa177;border-radius:20px;padding:5px 14px}.message{display:flex;align-items:flex-end;gap:7px;max-width:84%}.message.mine{align-self:flex-end;flex-direction:row-reverse}.bubble{border-radius:15px;background:white;padding:12px 15px;white-space:pre-wrap;line-height:1.65;overflow-wrap:anywhere;box-shadow:0 1px 2px #00000009}.mine .bubble{background:#9de77c}.stamp{font-size:9px;white-space:nowrap;color:#415f71;margin-bottom:3px}.card{padding:0;overflow:hidden;width:300px;max-width:100%}.card h3{margin:0;padding:16px 16px 6px;font-size:16px}.card p{margin:0;padding:6px 16px 16px;font-size:13px;color:#63756c}.card button{display:block;background:white;border-top:1px solid #e5ebe7;padding:12px;width:100%;color:#078743;font-weight:600}.card button:hover{background:#eff8f1}.rich{display:grid;grid-template-columns:repeat(3,1fr);background:#eff3ef;gap:1px;flex-shrink:0;border-top:1px solid #dfe6df}.rich button{background:#f9fbf8;color:#365143;min-height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px}.rich b{font-size:22px;font-weight:400}.rich button:first-child{background:#4b6d54;color:white}.rich[hidden]{display:none}.composer{display:flex;align-items:center;padding:10px 14px;gap:9px;flex-shrink:0}.composer input{flex:1;min-width:0;padding:11px;border:0;background:#f2f5f3;border-radius:22px}.send{background:#06b852;color:white;border-radius:50%;height:36px;width:36px;font-size:20px}.menutoggle{border-top:1px solid #edf0ed;background:white;color:#697e70;width:100%;padding:8px;font-size:11px}.mode{padding:6px 12px;background:#f8faf8;border-bottom:1px solid #e8eeea;display:flex;gap:6px;align-items:center;flex-shrink:0}.mode button{border-radius:20px;padding:6px 14px;background:#eef1ee;color:#53665a;font-size:12px}.mode button[aria-pressed=true]{background:#173b30;color:white}.mode span{margin-left:auto;font-size:10px;color:#6f7c73}dialog{border:0;border-radius:15px;width:min(760px,95vw);max-height:90dvh;padding:26px;box-shadow:0 20px 70px #0004}dialog::backdrop{background:#132d2866}dialog h2{font-size:22px}dialog p{line-height:1.8}dialog .close{float:right;background:#eef3ee;border-radius:50%;padding:8px 12px}.entry{border:1px solid #dce6de;padding:14px;border-radius:10px;margin:10px 0;line-height:1.8}.entry button,.primary{padding:10px 16px;border-radius:6px;background:#16874d;color:white;margin:5px}.entry .secondary{background:#e8eeea;color:#23432f}dialog form label{display:block;margin:14px 0 5px}dialog form input,dialog form select{padding:10px;width:100%;border:1px solid #becdc2;border-radius:6px}.privacy{font-size:12px;color:#63746a}table{border-collapse:collapse;width:100%;font-size:12px}td,th{text-align:left;padding:10px;border-bottom:1px solid #e0e8e3}th{background:#eff4ef}.plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.plan-grid section{padding:16px;background:#f0f5f1;border-radius:10px}.plan-grid strong{font-size:24px;display:block;color:#216943}.error{color:#a33327}a{color:#08794b}@media(max-width:1050px){.app{margin:0;border-radius:0;height:calc(100dvh - 44px);grid-template-columns:58px 240px minmax(300px,1fr)}.chat{padding:18px}}@media(max-width:700px){.banner{padding:0 12px;font-size:10px}.rail,.list{display:none}.app{display:flex;min-height:0}.window{width:100%}.back{display:block}.head{padding:10px;height:64px}.chat{padding:18px 12px}.mode span{display:none}.message{max-width:92%}.rich button{min-height:63px}.plan-grid{grid-template-columns:1fr}.app.show-list .list{display:block;width:100%}.app.show-list .window{display:none}.listnote{max-width:350px}.list h1{padding-top:30px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body>
<div class="banner"><span>互動提案 · LINE 風格網頁模擬，非 LINE 官方產品</span><button id="planOpen">建置方案與費用 ↗</button></div>
<main class="app"><nav class="rail" aria-label="導覽"><b>聊</b><span>◉</span><small>BOOKING STUDIO</small></nav><aside class="list"><h1>聊天</h1><div class="search">官方帳號 · 預約服務</div><button class="chatitem" id="openChat"><span class="avatar">日</span><span><strong>日和預約</strong><small>點此開始體驗你的預約旅程</small></span></button><div class="listnote">虛構店家與資料。<br>本頁不會傳送訊息、收款或建立 Google 行程；重整會清除紀錄。<label for="person">體驗顧客</label><select id="person"><option value="one">顧客 A</option><option value="two">顧客 B（測試時段衝突）</option></select><p>基礎版：人工確認需求<br>進階版：系統確認預約</p><button class="primary" id="deskOpen">店家模擬工作台</button></div></aside>
<section class="window" aria-label="日和預約聊天室"><header class="head"><button class="icon back" id="back" aria-label="返回聊天列表">‹</button><span class="avatar">日</span><div><h2>日和預約</h2><small id="subtitle">基礎版 · 人工接待</small></div><div class="tools"><button class="icon" id="infoOpen" aria-label="店家資訊">ⓘ</button><button class="icon" id="moreOpen" aria-label="更多操作">☰</button></div></header>
<div class="mode"><button id="basic" aria-pressed="true">基礎版</button><button id="advanced" aria-pressed="false">進階版</button><span>台灣時間 · 單店示範</span></div>
<div id="chat" class="chat" role="log" aria-live="polite"></div>
<form id="composer" class="composer"><button type="button" class="icon" id="attach" aria-label="附件說明">＋</button><input id="message" aria-label="輸入訊息" placeholder="輸入訊息" maxlength="500" autocomplete="off"><button class="send" aria-label="傳送訊息">↑</button></form>
<div class="rich" id="rich"><button data-text="立即預約"><b>▣</b><span id="bookLabel">預約需求</span></button><button data-text="服務與價目表"><b>≡</b>服務價目</button><button data-text="我的預約"><b>◷</b>我的紀錄</button><button data-text="常見問題"><b>?</b>常見問題</button><button data-text="交通資訊"><b>⌖</b>交通資訊</button><button data-text="真人協助"><b>♧</b>聯絡客服</button></div><button class="menutoggle" id="menuToggle" aria-expanded="true">服務選單 ▾</button></section></main>
<dialog id="modal"><button class="close" id="closeModal" aria-label="關閉">✕</button><div id="modalBody"></div></dialog>
<script>
// Browser-only demonstration. No network, credentials, or production booking data.
const services=[{id:'basic',name:'基礎護理',minutes:60,price:800},{id:'deep',name:'深層放鬆',minutes:90,price:1200},{id:'consult',name:'服務諮詢',minutes:30,price:0}];
const drafts={},bookings=[],cases=[],preferences={};let serial=0;
const localDate=(d)=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
const txt=text=>({type:'text',text});
const card=(title,body,buttons=[])=>({type:'flex',contents:{type:'bubble',body:{contents:[{text:title},{text:body}]},footer:{contents:buttons.map(([label,data])=>({action:{label,data}}))}}});
const serviceMenu=()=>card('日和預約｜離線示範','選擇服務開始；所有資料僅存在此分頁，重新載入即清除。',services.map(s=>[`${s.name} · NT$${s.price}`,`service:${s.id}`]));
const available=(s,start,exclude)=>start>Date.now()+120*60000&&!bookings.some(b=>b.id!==exclude&&b.status==='confirmed'&&start<b.start+(b.minutes+15)*60000&&start+(s.minutes+15)*60000>b.start);
function dateMenu(d){return card('選擇日期','示範營業時間 10:00–18:00，服務後保留 15 分鐘。',Array.from({length:7},(_,i)=>{const day=localDate(new Date(Date.now()+(i+1)*86400000));return[day,`date:${d.token}:${day}`];}));}
function slotMenu(d,day){const s=services.find(x=>x.id===d.serviceId);const options=[];for(let minute=600;minute+s.minutes+15<=1080;minute+=30){const time=`${String(Math.floor(minute/60)).padStart(2,'0')}:${String(minute%60).padStart(2,'0')}`;const start=Date.parse(`${day}T${time}:00+08:00`);if(available(s,start,d.bookingId))options.push([time,`slot:${d.token}:${start}`]);}return card('選擇時段',day,options.length?options:[['重新選日期',`dates:${d.token}`]]);}
function offlineEvent(data){
 const who=data.person;let messages=[];let d=drafts[who];const text=(data.text||'').trim();const parts=(data.postback||'').split(':');const action=parts[0];
 const owned=id=>bookings.find(b=>b.id===id&&b.owner===who);
 const fail=()=>messages=[txt('此操作已失效，請重新查詢或開始預約。')];
 if(text==='主選單'||text==='立即預約'||text==='服務與價目表'){delete drafts[who];messages=[serviceMenu()];}
 else if(text==='我的預約'){messages=bookings.filter(b=>b.owner===who).map(b=>card(b.status==='confirmed'?'我的預約':'已取消',`${b.service}\n${new Date(b.start).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false})}\n預約人：${b.name}\nNT$${b.price} · ${b.id}`,b.status==='confirmed'?[["改期",`edit:${b.id}`],["取消預約",`cancel:${b.id}`]]:[]));if(!messages.length)messages=[txt('目前沒有預約。點選「立即預約」開始。')];}
 else if(text==='真人協助'){cases.push({id:++serial,owner:who,status:'待處理',message:'要求真人協助'});messages=[txt('已建立示範協助案件。可繼續輸入需求，並至店家工作台查看；此離線版不會通知真人。')];}
 else if(text==='交通資訊')messages=[txt('日和示範店｜此為虛構地點，正式使用前請填入店家地址。')];
 else if(text==='停止提醒'||text==='開啟提醒'){preferences[who]=text==='開啟提醒';messages=[txt(`${text}（只切換示範偏好，不會發送通知）`)];}
 else if(action==='service'){const s=services.find(s=>s.id===parts[1]);if(!s)fail();else{d=drafts[who]={serviceId:s.id,state:'date',token:String(++serial)};messages=[dateMenu(d)];}}
 else if(action==='edit'){const b=owned(parts[1]);if(!b||b.status!=='confirmed')fail();else if(b.start-Date.now()<86400000)messages=[txt('距開始不足 24 小時，請聯絡店家協助。')];else{d=drafts[who]={serviceId:b.serviceId,state:'date',token:String(++serial),bookingId:b.id,name:b.name};messages=[dateMenu(d)];}}
 else if(action==='cancel'||action==='remove'){const b=owned(parts[1]);if(!b||b.status!=='confirmed')fail();else if(b.start-Date.now()<86400000)messages=[txt('距開始不足 24 小時，請聯絡店家協助。')];else if(action==='cancel')messages=[card('確認取消',`確定取消 ${b.service}？`,[['確認取消',`remove:${b.id}`]])];else{b.status='cancelled';delete drafts[who];messages=[txt('預約已取消，時段已釋出。')];}}
 else if(['dates','date','slot','confirm'].includes(action)){
  if(!d||parts[1]!==d.token)fail();
  else if(action==='dates'){d.state='date';messages=[dateMenu(d)];}
  else if(action==='date'){const day=parts[2];const delta=Date.parse(`${day}T10:00:00+08:00`)-Date.now();if(!/^\d{4}-\d{2}-\d{2}$/.test(day)||delta<0||delta>8*86400000)fail();else{d.day=day;d.state='slot';messages=[slotMenu(d,day)];}}
  else if(action==='slot'){const start=Number(parts[2]),s=services.find(s=>s.id===d.serviceId);if(d.state!=='slot'||localDate(new Date(start))!==d.day||!available(s,start,d.bookingId))messages=[txt('此時段已不可預約，請重新選擇。')];else{d.start=start;d.state=d.name?'review':'name';messages=d.name?review(d):[txt('請輸入虛構預約姓名（1 至 40 字）。')];}}
  else if(action==='confirm'){const s=services.find(s=>s.id===d.serviceId);const old=d.bookingId?owned(d.bookingId):null;if(d.state!=='review')fail();else if(d.bookingId&&(!old||old.status!=='confirmed'||old.start-Date.now()<86400000))fail();else if(!available(s,d.start,d.bookingId))messages=[txt('此時段剛被預約，請重新選擇；原預約仍保留。'),dateMenu(d)];else{const b={id:old?.id??`DEMO-${++serial}`,owner:who,serviceId:s.id,service:s.name,minutes:s.minutes,price:s.price,start:d.start,name:d.name,status:'confirmed'};if(old)Object.assign(old,b);else bookings.push(b);delete drafts[who];messages=[card('預約已成立',`${b.service}\n${new Date(b.start).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'})}\nNT$${b.price}\n編號 ${b.id}`)];}}
 }
 else if(d?.state==='name'&&text){if(text.length>40)messages=[txt('姓名請使用 1 至 40 字。')];else{d.name=text;d.state='review';messages=review(d);}}
 else if(text){const c=cases.findLast(c=>c.owner===who&&c.status==='待處理');if(c){c.message+='\n'+text;messages=[txt('已記錄示範需求，可至店家工作台查看。')];}else messages=[txt('請使用選單開始預約，或選擇「我的預約」、「真人協助」。')];}
 d=drafts[who];const latest=bookings.filter(b=>b.owner===who).at(-1);return{messages,preview:{draft:d?{...d,service:services.find(s=>s.id===d.serviceId)?.name}:null,latest}};
}
function review(d){const s=services.find(s=>s.id===d.serviceId);return[card('確認預約',`${s.name} · ${s.minutes} 分鐘 · NT$${s.price}\n${new Date(d.start).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'})}\n預約人：${d.name}\n開始前 24 小時可改期或取消。確認只建立此分頁的示範紀錄。`,[['確認建立',`confirm:${d.token}`]])];}

let mode='basic',who='one';const logs=new Map(),requests=[],handoff=new Set(),consented=new Set();let reqCounter=0;
const chat=document.querySelector('#chat'),modal=document.querySelector('#modal'),body=document.querySelector('#modalBody');
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;};
const key=()=>mode+who;const time=()=>new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Taipei'});
function push(message,mine=false,target=key()){if(!logs.has(target))logs.set(target,[]);logs.get(target).push({message,mine});if(target===key())draw();}
function draw(){chat.replaceChildren(el('div','今天 · 示範對話','date'));for(const item of logs.get(key())??[]){const wrap=el('div',undefined,'message'+(item.mine?' mine':''));const bubble=el('div',undefined,'bubble');const m=item.message;if(m.type==='text')bubble.textContent=m.text;else{bubble.classList.add('card');bubble.append(el('h3',m.contents.body.contents[0].text),el('p',m.contents.body.contents[1].text));for(const b of m.contents.footer?.contents??[]){const bt=el('button',b.action.label);bt.onclick=()=>send({postback:b.action.data},b.action.label);bubble.append(bt);}}wrap.append(bubble,el('small',time(),'stamp'));chat.append(wrap);}chat.scrollTop=chat.scrollHeight;}
function show(title){body.replaceChildren(el('h2',title));if(!modal.open)modal.showModal();}
function button(text,fn,parent=body,cls='primary'){const b=el('button',text,cls);b.onclick=fn;parent.append(b);return b;}
function welcome(){if(logs.has(key()))return draw();push(txt(`歡迎來到日和預約！\n${mode==='basic'?'此為基礎接待：提交需求後由店員核對，再通知是否成立。':'此為進階預約：選擇服務與可用時段，確認後才建立示範預約。'}\n示範客服時間 10:00–18:00。請使用虛構資料。`));}
function switchMode(next){mode=next;document.querySelector('#basic').setAttribute('aria-pressed',String(mode==='basic'));document.querySelector('#advanced').setAttribute('aria-pressed',String(mode==='advanced'));document.querySelector('#subtitle').textContent=mode==='basic'?'基礎版 · 人工接待':'進階版 · 自助預約';document.querySelector('#bookLabel').textContent=mode==='basic'?'預約需求':'立即預約';welcome();}
function requestForm(){show('預約需求表 · 外部表單模擬');body.append(el('p','此表單不查詢即時空位、不保留時段；送出後需由店家人工確認。','privacy'));const f=el('form');for(const [id,label,type] of [['reqName','姓名（請用虛構姓名）','text'],['reqDate','希望日期','date'],['reqTime','希望時段','time']]){const l=el('label',label);l.htmlFor=id;const input=el('input');input.id=id;input.type=type;input.required=true;if(type==='date')input.min=localDate(new Date());if(type==='text')input.maxLength=40;f.append(l,input);}const label=el('label','服務項目');label.htmlFor='reqService';const s=el('select');s.id='reqService';for(const svc of services){const o=el('option',`${svc.name} · NT$${svc.price}`);o.value=svc.id;s.append(o);}f.append(label,s,el('p','送出表示同意將這些虛構資料用於本頁需求演示。重整即清除，沒有第三方傳輸。','privacy'));const submit=el('button','送出需求','primary');f.append(submit);const owner=who;f.onsubmit=e=>{e.preventDefault();if(!f.reportValidity())return;const name=f.querySelector('#reqName').value.trim();if(!name)return;const r={id:'REQ-'+(++reqCounter),owner,name,date:f.querySelector('#reqDate').value,time:f.querySelector('#reqTime').value,service:services.find(x=>x.id===s.value).name,status:'待人工確認'};requests.push(r);modal.close();push(txt(`需求 ${r.id} 已收到，待人工確認。\n${r.service}／${r.date} ${r.time}\n尚未保留時段，尚未成立預約。`),false,'basic'+owner);};body.append(f);}
function send(data,label){const text=data.text??'';push(txt(label??text),true);if(handoff.has(key())&&!['我的預約','主選單','結束人工協助'].includes(text)&&!data.postback){push(txt('示範客服已接手，留言已保留在此分頁。可到店家工作台結束接管。'));return;}
 if(text==='結束人工協助'){handoff.delete(key());push(txt('已結束示範接管，恢復選單服務。'));return;}
 if(text==='真人協助'){handoff.add(key());push(txt('已進入真人協助示範，後續一般訊息不再觸發自動 FAQ。\n示範工作台可結束接管；本頁不會通知真實店員。'));return;}
 if(text==='常見問題'){push(txt('服務時間示範為每日 10:00–18:00。\n基礎版由店員確認空位及改取消；進階版可在開始前 24 小時自行改取消。\n本頁不收訂金、不提供付款或限時鎖位。'));return;}
 if(mode==='basic'){if(text==='立即預約'){push(card('提交預約需求','開啟需求表，選擇希望日期與時段；空位由店員核對。',[['填寫需求表','request']]));}else if(data.postback==='request')requestForm();else if(text==='我的預約'){const rows=requests.filter(r=>r.owner===who);push(txt(rows.length?rows.map(r=>`${r.id}｜${r.service}\n${r.date} ${r.time}｜${r.status}`).join('\n\n'):'目前沒有需求紀錄。'));}else if(text==='服務與價目表')push(txt(services.map(s=>`${s.name}｜${s.minutes} 分鐘｜NT$${s.price}`).join('\n')+'\n價格皆為示範，實際由店家確認。'));else if(text==='交通資訊')push(txt('日和示範店，非真實營業地點。正式版提供核准地址、營業時間與地圖連結。'));else push(txt('請點下方選單查看資訊或提交需求；需要改期取消請點「聯絡客服」，由店員核對。'));return;}
 if((text==='立即預約'||text==='服務與價目表')&&!consented.has(who)){const owner=who;show('預約資料說明');body.append(el('p','本頁只使用虛構姓名與示範預約。資料存在此分頁，重整即清除，不傳送 LINE 或 Google。正式服務須另提供經營主體、用途、保存期限及刪除聯絡窗口。'));button('了解，開始選擇服務',()=>{consented.add(owner);modal.close();offlineEvent({person:owner,text:'立即預約'}).messages.forEach(m=>push(m));});return;}
 try{offlineEvent({...data,person:who}).messages.forEach(m=>push(m));}catch{push(txt('操作已失效，請從「立即預約」重新開始。'));}}
function desk(){show('店家模擬工作台');body.append(el('p','這是示範控制，不是 LINE 官方管理介面。基礎版由人員自行核對外部排程；點選確認不會替你自動查空位。','privacy'));for(const r of requests){const box=el('section',undefined,'entry');box.append(el('strong',r.id+' · '+r.status),el('p',`${r.name}｜${r.service}\n${r.date} ${r.time}`));if(r.status==='待人工確認'){button('已人工核對，確認成立',()=>{r.status='店員已確認';push(txt(`【店員模擬回覆】${r.id} 已人工確認成立：${r.service}，${r.date} ${r.time}。`),false,'basic'+r.owner);desk();},box);button('無法安排',()=>{r.status='無法安排';push(txt(`【店員模擬回覆】${r.id} 無法安排，請聯絡店員選擇其他時段。`),false,'basic'+r.owner);desk();},box,'primary secondary');}body.append(box);}for(const b of bookings){body.append(el('div',`${b.id} · ${b.service} · ${b.name}\n${new Date(b.start).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'})} · ${b.status==='confirmed'?'已成立':'已取消'}`,'entry'));}if(!requests.length&&!bookings.length)body.append(el('p','目前沒有紀錄。'));for(const k of handoff)button('結束接管：'+k,()=>{handoff.delete(k);push(txt('【店員模擬】已結束人工協助，恢復自助操作。'),false,k);desk();});}
function plan(){show('基礎版與進階版');const g=el('div',undefined,'plan-grid');for(const [title,hours,content] of [['基礎接待','24–36 小時','OA 原生資訊／歡迎／FAQ／選單 → 外部需求表 → 人工核對 → 人工通知。'],['進階預約','加建 64–104 小時','Messaging API → 驗簽收件箱 → 交易與時段資料庫 → 回覆；提醒與日曆獨立選配。']]){const s=el('section');s.append(el('h3',title),el('strong',hours),el('p',content));g.append(s);}body.append(g,el('p','沿用既有程式，假設 NT$1,500／小時、未稅。進階核心加建 NT$96,000–156,000；基礎＋進階共 88–140 小時。平台、訂閱、訊息與金流另計。'));const table=el('table');for(const row of [['進階核心工作','工時','費用 NT$'],['Provider／環境／API','12–20','18,000–30,000'],['預約交易與改取消','24–36','36,000–54,000'],['工作台與客服接管','12–20','18,000–30,000'],['事件生命週期／驗收／維運','16–28','24,000–42,000'],['選配：前一天提醒','8–16','12,000–24,000'],['選配：日曆單向同步','8–16','12,000–24,000']]){const tr=el('tr');row.forEach(v=>tr.append(el('td',v)));table.append(tr);}body.append(table,el('p','工時不含審核與補件等待。藍盾、CP、LIFF、MINI App、LAP 與 LINE POINTS 是獨立選型，不是預約核心前提。此展示並未實作真實推播、付款或身分驗證。','privacy'));}
document.querySelectorAll('[data-text]').forEach(b=>b.onclick=()=>send({text:b.dataset.text}));document.querySelector('#composer').onsubmit=e=>{e.preventDefault();const input=document.querySelector('#message');if(input.value.trim()){send({text:input.value.trim()});input.value='';}};
document.querySelector('#person').onchange=e=>{who=e.target.value;welcome();};document.querySelector('#basic').onclick=()=>switchMode('basic');document.querySelector('#advanced').onclick=()=>switchMode('advanced');document.querySelector('#planOpen').onclick=plan;document.querySelector('#deskOpen').onclick=desk;document.querySelector('#closeModal').onclick=()=>modal.close();document.querySelector('#infoOpen').onclick=()=>{show('日和預約 · 示範商家');body.append(el('p','服務時間 10:00–18:00。服務、價格與地址均為示範；請勿填入真實個資。此頁模擬 LINE 常見聊天操作，實際 LINE 顯示依手機版本而異。'));};document.querySelector('#moreOpen').onclick=()=>{show('更多操作');button('店家模擬工作台',desk);button('建置方案與費用',plan);button('停止提醒（進階版偏好示範）',()=>{modal.close();if(mode==='advanced')send({text:'停止提醒'});else push(txt('基礎版沒有自動提醒排程。'));});button('結束人工協助',()=>{modal.close();send({text:'結束人工協助'});});button('切換示範顧客 A／B',()=>{who=who==='one'?'two':'one';document.querySelector('#person').value=who;modal.close();welcome();});};document.querySelector('#attach').onclick=()=>{show('附件');body.append(el('p','此展示只支援文字與預約卡片，不上傳照片或檔案。正式 Bot 收到圖片／貼圖時會依已設定規則處理。'));};document.querySelector('#menuToggle').onclick=e=>{const rich=document.querySelector('#rich');rich.hidden=!rich.hidden;e.target.setAttribute('aria-expanded',String(!rich.hidden));e.target.textContent='服務選單 '+(rich.hidden?'▴':'▾');};document.querySelector('#back').onclick=()=>document.querySelector('.app').classList.add('show-list');document.querySelector('#openChat').onclick=()=>document.querySelector('.app').classList.remove('show-list');welcome();

</script>
</body></html>
